<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Meta Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brand: #6366f1;
      --brand-glow: rgba(99, 102, 241, 0.4);
      --bg: #080818;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    /* ── Animated background ───── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 900px 700px at 15% 5%, rgba(99,102,241,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 700px 500px at 85% 90%, rgba(139,92,246,0.1) 0%, transparent 55%),
        radial-gradient(ellipse 500px 400px at 50% 50%, rgba(6,182,212,0.06) 0%, transparent 60%),
        linear-gradient(135deg, #080818 0%, #0d0d2e 50%, #080e1a 100%);
      animation: meshMove 12s ease-in-out infinite alternate;
    }

    @keyframes meshMove {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(30deg); }
    }

    /* ── Floating orbs ───── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.25;
      animation: orbFloat linear infinite;
      z-index: 0;
    }

    .orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #6366f1, transparent);
      top: -100px; left: -100px;
      animation-duration: 20s;
    }

    .orb-2 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #8b5cf6, transparent);
      bottom: -50px; right: -50px;
      animation-duration: 15s;
      animation-direction: reverse;
    }

    .orb-3 {
      width: 150px; height: 150px;
      background: radial-gradient(circle, #06b6d4, transparent);
      top: 50%; right: 10%;
      animation-duration: 18s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* ── Grid pattern ───── */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
    }

    /* ── Login card ───── */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: min(420px, 100%);
      animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(32px) scale(0.96);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Glow border animation */
    .login-glow {
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(99,102,241,0.5), rgba(139,92,246,0.3), rgba(6,182,212,0.3), rgba(99,102,241,0.5));
      background-size: 300% 300%;
      animation: glowRotate 4s ease infinite;
      opacity: 0.6;
      z-index: -1;
      filter: blur(6px);
    }

    @keyframes glowRotate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-card {
      background: rgba(12, 12, 32, 0.88);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow:
        0 32px 64px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.05) inset;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.7), rgba(139,92,246,0.5), transparent);
    }

    /* ── Logo area ───── */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .login-logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
      animation: iconPulse 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes iconPulse {
      0%, 100% { box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
      50% { box-shadow: 0 8px 32px rgba(99,102,241,0.65); }
    }

    .login-logo-icon svg { color: white; }

    .login-logo-text h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .login-logo-text span {
      font-size: 0.6875rem;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* ── Heading ───── */
    .login-heading {
      margin-bottom: 0.5rem;
    }

    .login-heading h1 {
      font-size: 1.625rem;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .login-heading p {
      margin-top: 0.375rem;
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    /* ── Form fields ───── */
    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.6875rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: #475569;
      transition: color 0.2s;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 0.7rem 0.875rem 0.7rem 2.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 0.9375rem;
      font-family: inherit;
      color: #f1f5f9;
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none;
    }

    .field input::placeholder { color: #475569; }

    .field input:focus {
      background: rgba(99,102,241,0.1);
      border-color: rgba(99,102,241,0.5);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
    }

    .field input:focus + .input-focus-line {
      transform: scaleX(1);
    }

    .field:focus-within .input-icon {
      color: #818cf8;
    }

    /* ── Submit button ───── */
    .btn-submit {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.8rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 0.9375rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      position: relative;
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.4s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99,102,241,0.5);
    }

    .btn-submit:hover::before {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit-text { transition: opacity 0.2s; }
    .btn-submit.loading .btn-submit-text { opacity: 0; }

    .btn-submit-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-submit.loading .btn-submit-spinner {
      opacity: 1;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* ── Error box ───── */
    .error-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.875rem;
      padding: 0.625rem 0.875rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      color: #f87171;
      font-size: 0.8125rem;
      font-weight: 500;
      min-height: 0;
      transform: translateY(-4px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .error-box.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Footer note ───── */
    .login-note {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.6875rem;
      color: #334155;
      line-height: 1.5;
    }

    /* ── Divider ───── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.07);
    }

    .divider-text {
      font-size: 0.6875rem;
      color: #334155;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── Decorative dots ───── */
    .deco-dots {
      position: absolute;
      top: -1rem;
      right: -1rem;
      width: 80px;
      height: 80px;
      background-image: radial-gradient(circle, rgba(99,102,241,0.3) 1.5px, transparent 1.5px);
      background-size: 12px 12px;
      opacity: 0.6;
    }

    /* ── Particle dots ───── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(99,102,241,0.4);
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(20px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="grid-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="particles" id="particles"></div>

  <div class="login-wrapper">
    <div class="login-glow"></div>
    <div class="login-card">
      <div class="deco-dots"></div>

      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z" fill="currentColor"/>
          </svg>
        </div>
        <div class="login-logo-text">
          <h2>Meta Marketing</h2>
          <span>Dashboard v3 · Internal</span>
        </div>
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <h1>Welcome back</h1>
        <p>Đăng nhập để truy cập dashboard reporting nội bộ.</p>
      </div>

      <!-- Form -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Username
          </label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Password
          </label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-submit-text">Đăng nhập</span>
          <div class="btn-submit-spinner"></div>
        </button>

        <div class="error-box" id="errorBox" role="alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="errorText"></span>
        </div>
      </form>

      <p class="login-note">
        Tài khoản được cấu hình trong <code style="color:#475569;font-size:0.6875rem;">.env</code> trên server.<br>
        Hỗ trợ: <code style="color:#475569;font-size:0.6875rem;">APP_USERNAME / APP_PASSWORD_HASH</code>
      </p>
    </div>
  </div>

  <script>
    // ── Particle generator ──
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1.5;
      p.style.cssText = `
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        opacity: ${Math.random() * 0.4 + 0.1};
        animation-duration: ${Math.random() * 12 + 8}s;
        animation-delay: ${Math.random() * 10}s;
        background: ${Math.random() > 0.5 ? 'rgba(99,102,241,0.5)' : 'rgba(139,92,246,0.5)'};
      `;
      container.appendChild(p);
    }

    // ── Form submission ──
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.add('visible');
      // Shake animation
      errorBox.style.animation = 'none';
      requestAnimationFrame(() => {
        errorBox.style.animation = 'shake 0.4s ease';
      });
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    function setLoading(val) {
      btn.disabled = val;
      btn.classList.toggle('loading', val);
    }

    // Add shake keyframe dynamically
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }
    `;
    document.head.appendChild(style);

    form.addEventListener('input', hideError);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Vui lòng điền đầy đủ username và password.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error || `Lỗi HTTP ${res.status}`);
        }

        // Success — animate out then redirect
        document.querySelector('.login-wrapper').style.transition = 'all 0.4s cubic-bezier(0.16,1,0.3,1)';
        document.querySelector('.login-wrapper').style.transform = 'scale(0.96) translateY(-10px)';
        document.querySelector('.login-wrapper').style.opacity = '0';
        setTimeout(() => window.location.href = '/', 400);

      } catch (err) {
        setLoading(false);
        showError(err.message || 'Đăng nhập thất bại. Vui lòng thử lại.');
      }
    });
  </script>
</body>
</html>
